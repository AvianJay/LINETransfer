name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1
  UV_NO_PROGRESS: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows 預設是 pwsh，統一用 bash 才能寫入 $GITHUB_ENV 和使用 sed
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get short Git commit hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Replace version and update channel in config.py
        # -i.bak 在 GNU 和 BSD (macOS) sed 都能用
        run: |
          sed -i.bak \
            -e 's/app_version = ".*"/app_version = "'"$COMMIT_HASH"'"/' \
            -e 's/update_channel = ".*"/update_channel = "nightly"/' \
            src/config.py
          rm src/config.py.bak
          grep -E '^(app_version|update_channel) =' src/config.py

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Build ${{ matrix.target }}
        run: |
          poetry run flet build ${{ matrix.target }} --verbose --no-rich-output --compile-app --compile-packages --build-version "$COMMIT_HASH"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: linetransfer-${{ matrix.target }}
          path: build/${{ matrix.target }}
